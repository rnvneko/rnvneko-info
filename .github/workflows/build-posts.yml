name: Build posts.json

# posts/*.md (pushed from the NAS) -> data/posts.json
on:
  push:
    branches: [master]
    paths:
      - 'posts/**'
      - 'scripts/build_posts.py'
      - '.github/workflows/build-posts.yml'
  workflow_dispatch:

# Builds are serialized so two quick pushes cannot race on data/posts.json.
concurrency:
  group: build-posts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build_posts.py uses git history for missing dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data/posts.json
        run: python scripts/build_posts.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Do NOT add "[skip ci]" here: the site is hosted on Netlify, which would then skip deploying this
            # commit and the new posts.json would never go live. This workflow cannot loop on its own commit
            # because it only triggers on posts/**, scripts/build_posts.py and this file (see "paths" above).
            git commit -m "chore: update posts.json from posts/*.md"
            git pull --rebase origin master
            git push
          fi
